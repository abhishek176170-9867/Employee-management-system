<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LeaveFlow ELMS - Enterprise Leave Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="file:///C:/Users/Abhishek/OneDrive/Desktop/employeeleavemanagementsystem/static/css/custom.css">
    
</head>
<body class="h-full text-slate-800 antialiased flex flex-col md:flex-row">

    

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        

        <!-- Flash Alert Messages -->
        <div class="px-6 pt-4">
            
                
            
        </div>

        <!-- Page Specific Body Content -->
        <main class="flex-1 p-6">
            
<div class="min-h-[85vh] flex items-center justify-center py-8">
    <div class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex h-14 w-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-600 items-center justify-center text-white shadow-xl shadow-indigo-500/25 mb-4">
                <i class="fa-solid fa-calendar-check text-2xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">LeaveFlow Enterprise</h2>
            <p class="text-sm text-slate-500 mt-1">Employee Leave Management & Attendance System</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200/80 p-8">
            <form method="POST" action="/login" class="space-y-5" id="loginForm">
                <div>
                    <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Corporate Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" id="email" name="email" required
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                               placeholder="name@company.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" name="password" required
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs text-slate-500">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span>Remember session</span>
                    </label>
                    <span class="text-indigo-600 hover:text-indigo-700 cursor-pointer font-medium">Single Sign-On (SSO) active</span>
                </div>

                <button type="submit"
                        class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-md shadow-indigo-600/30 transition flex items-center justify-center gap-2">
                    <span>Sign In to Portal</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div class="mt-8 pt-6 border-t border-slate-100">
                <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3 text-center">
                    ⚡ 1-Click Demo Profiles
                </p>
                <div class="grid grid-cols-1 gap-2">
                    <button type="button" onclick="fillAndSubmit('admin@company.com', 'admin123')"
                            class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 hover:bg-indigo-50/70 border border-slate-200 text-left transition group">
                        <div class="flex items-center gap-2.5">
                            <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">AV</span>
                            <div>
                                <p class="text-xs font-bold text-slate-800 group-hover:text-indigo-600">Alexandra Vance</p>
                                <p class="text-[10px] text-slate-500">Head of HR (Admin Role)</p>
                            </div>
                        </div>
                        <span class="text-[11px] font-semibold text-indigo-600 group-hover:translate-x-0.5 transition">Select &rarr;</span>
                    </button>

                    <button type="button" onclick="fillAndSubmit('john.doe@company.com', 'employee123')"
                            class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 hover:bg-emerald-50/70 border border-slate-200 text-left transition group">
                        <div class="flex items-center gap-2.5">
                            <span class="w-7 h-7 rounded-lg bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">JD</span>
                            <div>
                                <p class="text-xs font-bold text-slate-800 group-hover:text-emerald-600">John Doe</p>
                                <p class="text-[10px] text-slate-500">Senior Software Engineer (Employee Role)</p>
                            </div>
                        </div>
                        <span class="text-[11px] font-semibold text-emerald-600 group-hover:translate-x-0.5 transition">Select &rarr;</span>
                    </button>

                    <button type="button" onclick="fillAndSubmit('sarah.j@company.com', 'employee123')"
                            class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 hover:bg-pink-50/70 border border-slate-200 text-left transition group">
                        <div class="flex items-center gap-2.5">
                            <span class="w-7 h-7 rounded-lg bg-pink-600 text-white flex items-center justify-center text-xs font-bold">SJ</span>
                            <div>
                                <p class="text-xs font-bold text-slate-800 group-hover:text-pink-600">Sarah Jenkins</p>
                                <p class="text-[10px] text-slate-500">Lead UI/UX Designer (Employee Role)</p>
                            </div>
                        </div>
                        <span class="text-[11px] font-semibold text-pink-600 group-hover:translate-x-0.5 transition">Select &rarr;</span>
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">
            &copy; 2026 LeaveFlow Enterprise System. All rights reserved.
        </p>
    </div>
</div>

<script>
    function fillAndSubmit(email, pass) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = pass;
        document.getElementById('loginForm').submit();
    }
</script>

        </main>
    </div>

    <!-- Global App JS -->
    <script src="file:///C:/Users/Abhishek/OneDrive/Desktop/employeeleavemanagementsystem/static/js/app.js"></script>
    
</body>
</html>
